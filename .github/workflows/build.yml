name: Compilar APK Android Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js 22 (LTS)
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Configurar Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Instalar dependencias
      run: npm install --legacy-peer-deps

    - name: Compilar aplicación web
      run: npm run build

    - name: Sincronizar proyecto Android
      run: npx cap sync android

    - name: Generar firma de producción (Keystore RSA 2048-bit)
      run: |
        keytool -genkeypair -v \
          -keystore android/app/release.keystore \
          -alias controldiario \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass controldiario123 \
          -keypass controldiario123 \
          -dname "CN=Control Diario, O=SoyDelivery, C=ES"

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x android/gradlew

    - name: Compilar APK Release firmado (Gradle assembleRelease)
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Preparar archivo APK final
      run: |
        mkdir -p build-output
        if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
          cp android/app/build/outputs/apk/release/app-release.apk build-output/Control-Diario-v1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk build-output/Control-Diario-latest.apk
        else
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Control-Diario-v1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Control-Diario-latest.apk
        fi

    - name: Guardar archivo APK como Artifact de respaldo
      uses: actions/upload-artifact@v4
      with:
        name: Control-Diario-APK-v1.0.${{ github.run_number }}
        path: build-output/Control-Diario-v1.0.${{ github.run_number }}.apk
        retention-days: 30

    - name: Publicar Release oficial con APK firmado en GitHub
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Control Diario APK v1.0.${{ github.run_number }}
        body: |
          ## 📱 Control Diario - Visitas Efectivas (Release Oficial)
          **Versión:** `v1.0.${{ github.run_number }}`
          **Firma:** Release RSA 2048-bit (Esquema v1 + v2)
          
          ### 📥 Descarga Directa:
          Descarga **`Control-Diario-v1.0.${{ github.run_number }}.apk`** para instalar la versión oficial en tu teléfono Android.
          
          > 💡 **Instalación:** Si tu teléfono muestra el aviso de Google Play Protect al instalar un archivo descargado de internet, presiona en **"Instalar sin analizar"** para continuar.
        files: |
          build-output/Control-Diario-v1.0.${{ github.run_number }}.apk
          build-output/Control-Diario-latest.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
